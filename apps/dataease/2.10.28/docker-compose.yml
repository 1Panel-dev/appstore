services:
  dataease:
    image: registry.cn-qingdao.aliyuncs.com/dataease/dataease:v2.10.28
    restart: always
    container_name: ${CONTAINER_NAME}
    ports:
      - ${PANEL_APP_PORT_HTTP}:8100
    volumes:
      - ./conf:/opt/apps/config
      - ./logs:/opt/dataease2.0/logs
      - ./data/static-resource:/opt/dataease2.0/data/static-resource
      - ./cache:/opt/dataease2.0/cache
      - ./data/geo:/opt/dataease2.0/data/geo
      - ./data/map:/opt/dataease2.0/data/map
      - ./data/appearance:/opt/dataease2.0/data/appearance
      - ./data/exportData:/opt/dataease2.0/data/exportData
      - ./data/plugin:/opt/dataease2.0/data/plugin
      - ./data/font:/opt/dataease2.0/data/font
      - ./data/i18n:/opt/dataease2.0/data/i18n
      - ./data/report:/opt/dataease2.0/data/report
      - ./data/report-artifacts:/opt/dataease2.0/data/report-artifacts
    environment:
      DE_SYNC_AUTH_ENABLED: ${DE_SYNC_AUTH_ENABLED:-false}
      DE_SYNC_AUTH_SECRET: ${DE_SYNC_AUTH_SECRET:-}
      PANEL_DB_HOST: ${PANEL_DB_HOST}
      PANEL_DB_PORT: ${PANEL_DB_PORT}
      PANEL_DB_USER: ${PANEL_DB_USER}
      PANEL_DB_USER_PASSWORD: ${PANEL_DB_USER_PASSWORD}
      PANEL_DB_NAME: ${PANEL_DB_NAME}
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true