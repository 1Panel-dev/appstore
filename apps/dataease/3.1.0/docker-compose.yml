services:
  dataease:
    image: registry.cn-qingdao.aliyuncs.com/dataease/dataease:v3.1.0
    restart: always
    container_name: ${CONTAINER_NAME}
    stop_signal: SIGTERM
    stop_grace_period: 15s
    ports:
      - ${PANEL_APP_PORT_HTTP}:8100
    volumes:
      - ./conf:/opt/apps/config
      - ./logs:/opt/dataease3.0/logs
      - ./data/static-resource:/opt/dataease3.0/data/static-resource
      - ./cache:/opt/dataease3.0/cache
      - ./data/geo:/opt/dataease3.0/data/geo
      - ./data/map:/opt/dataease3.0/data/map
      - ./data/appearance:/opt/dataease3.0/data/appearance
      - ./data/exportData:/opt/dataease3.0/data/exportData
      - ./data/plugin:/opt/dataease3.0/data/plugin
      - ./data/font:/opt/dataease3.0/data/font
      - ./data/driver:/opt/dataease3.0/data/driver
      - ./data/i18n:/opt/dataease3.0/data/i18n
      - ./data/report:/opt/dataease3.0/data/report
    environment:
      PANEL_DB_HOST: ${PANEL_DB_HOST}
      PANEL_DB_PORT: ${PANEL_DB_PORT}
      PANEL_DB_USER: ${PANEL_DB_USER}
      PANEL_DB_USER_PASSWORD: ${PANEL_DB_USER_PASSWORD}
      PANEL_DB_NAME: ${PANEL_DB_NAME}
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true