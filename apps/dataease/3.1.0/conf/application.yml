server:
  tomcat:
    connection-timeout: 70000
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  flyway:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 20
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${PANEL_DB_HOST}:${PANEL_DB_PORT}/${PANEL_DB_NAME}?autoReconnect=false&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PANEL_DB_USER}
    password: ${PANEL_DB_USER_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 1000
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        temp:
          use_jdbc_metadata_defaults: false
    hibernate:
      naming:
        physical-strategy:  io.dataease.config.DynamicCaseNamingStrategy
      ddl-auto: update
    show-sql: false
dataease:
  export:
    views:
      limit: 100000
    dataset:
      limit: 100000
  origin-list: http://localhost:8000
