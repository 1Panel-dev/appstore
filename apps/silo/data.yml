    ko: Silo는 커뮤니티가 유지 관리하는 MinIO 포크로, 고성능 S3 호환 객체 스토리지를 제공합니다.
    ms: Silo ialah fork MinIO yang diselenggara oleh komuniti, menyediakan storan objek serasi S3 berprestasi tinggi.
