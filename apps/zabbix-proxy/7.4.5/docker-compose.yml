version: '3.8'

services:
  zabbix-proxy-mysql:
    image: zabbix/zabbix-proxy-mysql:alpine-7.4.5
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_RECEIVE}:10051"
    environment:
      - TZ=Asia/Shanghai
      - ZBX_HOSTNAME=${ZABBIX_PROXY_HOSTNAME}
      - ZBX_SERVER_HOST=${ZABBIX_SERVER}
      - ZBX_PROXYMODE=0
      - DB_SERVER_HOST=${PANEL_DB_HOST}
      - DB_SERVER_PORT=${PANEL_DB_PORT}
      - MYSQL_DATABASE=${PANEL_DB_NAME}
      - MYSQL_USER=${PANEL_DB_USER}
      - MYSQL_PASSWORD=${PANEL_DB_USER_PASSWORD}
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
