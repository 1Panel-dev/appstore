services:
  arcadia:
    image: supermanito/arcadia:1.0.1
    container_name: "${CONTAINER_NAME}"
    hostname: "${CONTAINER_NAME}"
    restart: always
    tty: true
    cap_add:
      - SYS_PTRACE
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5678"
    volumes:
      - ./data/config:/arcadia/config
      - ./data/log:/arcadia/log
      - ./data/scripts:/arcadia/scripts
      - ./data/repo:/arcadia/repo
      - ./data/raw:/arcadia/raw
      - ./data/tgbot:/arcadia/tgbot
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
