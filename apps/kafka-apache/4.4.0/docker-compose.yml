services:
  kafka-apache:
    image: apache/kafka:4.4.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${CONTAINER_NAME}:19092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST}:${PANEL_APP_PORT_HTTP}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./data:/var/lib/kafka/data
    command:
      - /bin/bash
      - "-ec"
      - |
        if [ -f "$$KAFKA_LOG_DIRS/meta.properties" ]; then
          CLUSTER_ID=$$(sed -n 's/^cluster[.]id=//p' "$$KAFKA_LOG_DIRS/meta.properties")
          test -n "$$CLUSTER_ID"
        else
          CLUSTER_ID=$$(/opt/kafka/bin/kafka-storage.sh random-uuid)
        fi
        export CLUSTER_ID
        exec /etc/kafka/docker/run
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
