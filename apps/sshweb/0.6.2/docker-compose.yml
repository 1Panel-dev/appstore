services:
  sshweb:
    image: ghcr.io/baiduxc/sshweb:0.6.2
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:45678"
    environment:
      - SSHWEB_PASSWORD=${SSHWEB_PASSWORD}
    volumes:
      - ./data:/data
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
