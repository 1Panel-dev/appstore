additionalProperties:
    formFields:
        - default: ""
          envKey: PANEL_DB_HOST
          key: postgresql
          minVersion: "17"
          labelEn: Database Service
          labelZh: 数据库服务
          label:
            en: Database Service
            es-es: Servicio de base de datos
            fa: 'سرویس پایگاه داده'
            ja: データベースサービス
            ms: Perkhidmatan Pangkalan Data
            pt-br: Serviço de Banco de Dados
            ru: Сервис базы данных
            ko: 데이터베이스 서비스
            zh: 数据库服务
            zh-Hant: 數據庫 服務
            tr: Veritabanı Hizmeti
          description:
            en: Wiki.js v3 requires PostgreSQL 17 or later.
            es-es: Wiki.js v3 requiere PostgreSQL 17 o posterior.
            fa: Wiki.js v3 به PostgreSQL 17 یا جدیدتر نیاز دارد.
            ja: Wiki.js v3 には PostgreSQL 17 以降が必要です。
            ms: Wiki.js v3 memerlukan PostgreSQL 17 atau lebih baharu.
            pt-br: O Wiki.js v3 requer PostgreSQL 17 ou posterior.
            ru: Для Wiki.js v3 требуется PostgreSQL 17 или новее.
            ko: Wiki.js v3에는 PostgreSQL 17 이상이 필요합니다.
            zh: Wiki.js v3 仅支持 PostgreSQL 17 及以上版本。
            zh-Hant: Wiki.js v3 僅支援 PostgreSQL 17 及以上版本。
            tr: Wiki.js v3, PostgreSQL 17 veya üstünü gerektirir.
          required: true
          type: service
        - default: wiki
          envKey: PANEL_DB_NAME
          labelEn: Database
          labelZh: 数据库名
          label:
            en: Database
            es-es: Base de datos
            fa: 'پایگاه داده'
            ja: データベース
            ms: Pangkalan Data
            pt-br: Banco de Dados
            ru: База данных
            ko: 데이터베이스
            zh: 数据库名
            zh-Hant: 數據庫名
            tr: Veritabanı
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: wikijs
          envKey: PANEL_DB_USER
          labelEn: User
          labelZh: 数据库用户
          label:
            en: User
            es-es: Usuario
            fa: 'کاربر'
            ja: ユーザー
            ms: Pengguna
            pt-br: Usuário
            ru: Пользователь
            ko: 사용자
            zh: 数据库用户
            zh-Hant: 數據庫用戶
            tr: Kullanıcı
          random: true
          required: true
          rule: paramCommon
          type: text
        - default: wikijsrocks
          envKey: PANEL_DB_USER_PASSWORD
          labelEn: Password
          labelZh: 数据库用户密码
          label:
            en: Password
            es-es: Contraseña
            fa: 'رمز عبور'
            ja: パスワード
            ms: Kata Laluan
            pt-br: Senha
            ru: Пароль
            ko: 비밀번호
            zh: 数据库用户密码
            zh-Hant: 數據庫用戶密碼
            tr: Parola
          random: true
          required: true
          type: password
        - default: 3000
          edit: true
          envKey: PANEL_APP_PORT_HTTP
          labelEn: Port
          labelZh: 端口
          label:
            en: Port
            es-es: Puerto
            fa: 'پورت'
            ja: ポート
            ms: Port
            pt-br: Porta
            ru: Порт
            ko: 포트
            zh: 端口
            zh-Hant: 埠
            tr: Bağlantı Noktası
          required: true
          rule: paramPort
          type: number
