services:
  snipe-it:
    image: snipe/snipe-it:v8.8.4
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    env_file:
      - ./config.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      APP_KEY_FILE: /var/lib/snipeit/app-key
      DB_CONNECTION: "${PANEL_DB_TYPE}"
      DB_HOST: "${PANEL_DB_HOST}"
      DB_PORT: "${PANEL_DB_PORT}"
      DB_DATABASE: "${PANEL_DB_NAME}"
      DB_USERNAME: "${PANEL_DB_USER}"
      DB_PASSWORD: "${PANEL_DB_USER_PASSWORD}"
    volumes:
      - ./data:/var/lib/snipeit
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
