services:
  comfyui:
    image: 1panel/comfyui:v0.33.1
    container_name: "${CONTAINER_NAME}"
    restart: always
    stop_grace_period: 2m
    shm_size: "8gb"
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8188"
    environment:
      COMFYUI_LISTEN: "0.0.0.0"
      COMFYUI_PORT: "8188"
    volumes:
      - ./data:/data
    ulimits:
      memlock: -1
      stack: 67108864
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
