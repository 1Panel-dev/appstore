services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.5.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:51821"
      - "${PANEL_APP_PORT_UDP}:${PANEL_APP_PORT_UDP}/udp"
    environment:
      INSECURE: "${INSECURE}"
      DISABLE_IPV6: "true"
    volumes:
      - ./data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
