services:
  postgis:
    image: postgis/postgis:16-3.6-alpine
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5432"
    environment:
      POSTGRES_USER: "${PANEL_DB_ROOT_USER}"
      POSTGRES_PASSWORD: "${PANEL_DB_ROOT_PASSWORD}"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-h"
        - "127.0.0.1"
        - "-p"
        - "5432"
        - "-q"
        - "-U"
        - "${PANEL_DB_ROOT_USER}"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
