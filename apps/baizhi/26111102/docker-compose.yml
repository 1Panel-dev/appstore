x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
services:
  baizhi:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-admin:v26111102
    container_name: ${CONTAINER_NAME}
    restart: always
    logging: *logging
    init: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      baizhi-backend:
        condition: service_healthy
    environment:
      MONKEYAI_PUBLIC_URL: ${MONKEYAI_PUBLIC_URL}
      MONKEYAI_TLS_ENABLED: "false"
      MONKEYAI_AUTO_TLS_ENABLED: "false"
      MONKEYAI_TRUSTED_PROXY_CIDRS: ${MONKEYAI_TRUSTED_PROXY_CIDRS}
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
    volumes:
      - ./data/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
  baizhi-backend:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-backend:v26111102
    container_name: ${CONTAINER_NAME}-backend
    restart: always
    logging: *logging
    init: true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      baizhi-migrate:
        condition: service_completed_successfully
      baizhi-rustfs:
        condition: service_healthy
    environment:
      MONKEYAI_PUBLIC_URL: ${MONKEYAI_PUBLIC_URL}
      MONKEYAI_DATABASE_URL: &database-url "postgres://monkeyai:${MONKEYAI_DB_PASSWORD}@${CONTAINER_NAME}-db:5432/monkeyai?sslmode=disable"
      MONKEYAI_HTTP_ADDR: ":8080"
      MONKEYAI_INITIAL_ADMIN_EMAIL: ${MONKEYAI_INITIAL_ADMIN_EMAIL}
      MONKEYAI_INITIAL_ADMIN_NAME: "Admin"
      MONKEYAI_INITIAL_ADMIN_PASSWORD: ${MONKEYAI_INITIAL_ADMIN_PASSWORD}
      MONKEYAI_LOG_LEVEL: "warn"
      MONKEYAI_RUNTIME_RELAY: "true"
      MONKEYAI_RUNTIME_STATE_DIR: /app/runtime
      MONKEYAI_S3_ACCESS_KEY: "monkeyai"
      MONKEYAI_S3_SECRET_KEY: ${MONKEYAI_RUSTFS_SECRET_KEY}
      MONKEYAI_S3_ENDPOINT: "http://${CONTAINER_NAME}-rustfs:9000"
      MONKEYAI_S3_BUCKET: "monkeyai-resources"
      MONKEYAI_S3_REGION: "us-east-1"
      MONKEYAI_S3_FORCE_PATH_STYLE: "true"
      TMPDIR: /app/import-tmp
    volumes:
      - ./data/license:/app/license
      - ./data/runtime:/app/runtime
      - ./data/import-tmp:/app/import-tmp
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
  baizhi-db:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/basic/postgres:18.6
    container_name: ${CONTAINER_NAME}-db
    restart: always
    logging: *logging
    environment:
      POSTGRES_DB: "monkeyai"
      POSTGRES_USER: "monkeyai"
      POSTGRES_PASSWORD: ${MONKEYAI_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
  baizhi-migrate:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/monkeycode/monkeyai-migrate:v26111102
    container_name: ${CONTAINER_NAME}-migrate
    # 数据库迁移完成后应退出，不能像常驻服务一样自动重启。
    restart: "no"
    logging: *logging
    depends_on:
      baizhi-db:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database
      - *database-url
      - up
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
  baizhi-rustfs:
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/basic/rustfs:v1.0.0-rc.5
    container_name: ${CONTAINER_NAME}-rustfs
    restart: always
    logging: *logging
    user: "10001:10001"
    environment:
      RUSTFS_ACCESS_KEY: "monkeyai"
      RUSTFS_SECRET_KEY: ${MONKEYAI_RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      RUSTFS_VOLUMES: /data
    volumes:
      - ./data/rustfs:/data
      - ./data/rustfs-logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network
networks:
  1panel-network:
    external: true
