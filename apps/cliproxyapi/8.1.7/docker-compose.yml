services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v8.1.7
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8317"
    environment:
      MANAGEMENT_PASSWORD: "${PANEL_CLI_PROXY_MANAGEMENT_KEY}"
      CLIPROXYAPI_INITIAL_API_KEY: "${PANEL_CLI_PROXY_API_KEY}"
      WRITABLE_PATH: /data
    volumes:
      - ./data:/data
      - ./scripts/run-container.sh:/usr/local/bin/cliproxyapi-entrypoint:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/cliproxyapi-entrypoint
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
