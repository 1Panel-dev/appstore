additionalProperties:
  formFields:
    - default: 3430
      envKey: PANEL_APP_PORT_HTTP
      labelZh: Web UI 端口
      labelEn: Web UI Port
      label:
        zh: Web UI 端口
        zh-Hant: Web UI 埠
        en: Web UI Port
        ja: Web UIポート
        ko: 웹 UI 포트
        ms: Port Web UI
        pt-br: Porta da Web UI
        ru: Порт веб-интерфейса
        tr: Web UI Bağlantı Noktası
      required: true
      type: number
      rule: paramPort
    - default: magpie_web_key
      envKey: MAGPIE_WEB_KEY
