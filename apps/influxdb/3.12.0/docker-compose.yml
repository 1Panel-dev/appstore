services:
  influxdb:
    image: influxdb:3.12.0-core
    container_name: ${CONTAINER_NAME}
    restart: always
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB3_NODE_ID}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --admin-token-file=/var/lib/influxdb3/data/admin-token.json
      - --disable-telemetry-upload
    ports:
      - ${PANEL_APP_PORT_HTTP}:8181
    volumes:
      - ./data:/var/lib/influxdb3/data
      - ./plugins:/var/lib/influxdb3/plugins
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
