services:
  octop:
    image: ghcr.io/tencentcloud/octop:1.0.1
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8088"
    environment:
      HOME: /data
      OCTOP_BIND_HOST: 0.0.0.0
      OCTOP_PORT: 8088
      OCTOP_LOG_LEVEL: "${OCTOP_LOG_LEVEL}"
      OCTOP_DEFAULT_PASSWORD: "${OCTOP_DEFAULT_PASSWORD}"
      OCTOP_ADMIN_USERNAME: "${OCTOP_ADMIN_USERNAME}"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:8088/api/health || exit 1"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
