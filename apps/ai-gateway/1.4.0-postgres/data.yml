additionalProperties:
  supportVersion: 2.4
  formFields:
    - default: admin
      disabled: true
      envKey: AI_GATEWAY_INITIAL_ADMIN_USERNAME
      labelEn: Username
      labelZh: "用户名"
      label:
        en: Username
        es-es: Usuario
        ja: "ユーザー名"
        ms: Pengguna
        pt-br: "Usuário"
        ru: "Имя пользователя"
        ko: "사용자 이름"
        zh-Hant: "使用者名稱"
        zh: "用户名"
        tr: "Kullanıcı adı"
      required: true
      rule: paramCommon
      type: text
    - default: 1PanelAI
      envKey: AI_GATEWAY_INITIAL_ADMIN_PASSWORD
      labelEn: "Initial Admin Password"
      labelZh: "初始管理员密码"
      label:
        en: "Initial Admin Password"
        es-es: "Initial Admin Password"
        ja: "Initial Admin Password"
        ms: "Initial Admin Password"
        pt-br: "Initial Admin Password"
        ru: "Initial Admin Password"
        ko: "Initial Admin Password"
        zh-Hant: "初始管理員密碼"
        zh: "初始管理员密码"
        tr: "Initial Admin Password"
      description:
        en: "Password length must be between 12 and 128 bytes"
        es-es: "La longitud de la contraseña debe ser de entre 12 y 128 bytes"
        ja: "パスワードの長さは12～128バイトである必要があります"
        ms: "Panjang kata laluan mestilah antara 12 hingga 128 bait"
        pt-br: "O comprimento da senha deve ser de 12 a 128 bytes"
        ru: "Длина пароля должна составлять от 12 до 128 байт"
        ko: "비밀번호 길이는 12~128바이트여야 합니다"
        zh-Hant: "密碼長度須為 12 至 128 位元組"
        zh: "密码长度须为 12 至 128 字节"
        tr: "Parola uzunluğu 12 ile 128 bayt arasında olmalıdır"
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: "Web UI Port"
      labelZh: "Web UI 端口"
      label:
        en: "Web UI Port"
        es-es: "Puerto web"
        ja: "Web UIポート"
        ms: "Port Web UI"
        pt-br: "Porta da Web UI"
        ru: "Порт веб-интерфейса"
        ko: "웹 UI 포트"
        zh-Hant: "Web UI 埠"
        zh: "Web UI 端口"
        tr: "Web UI Bağlantı Noktası"
      required: true
      rule: paramPort
      type: number
    - default: ""
      envKey: PANEL_DB_HOST
      key: postgresql
      description:
        en: "Select a PostgreSQL 18 service; other major versions are not supported."
        zh: "请选择 PostgreSQL 18 服务，不支持其他主版本。"
        zh-Hant: "請選擇 PostgreSQL 18 服務，不支援其他主版本。"
        es-es: "Seleccione un servicio PostgreSQL 18; no se admiten otras versiones principales."
        fa: "سرویس PostgreSQL 18 را انتخاب کنید؛ نسخه‌های اصلی دیگر پشتیبانی نمی‌شوند."
        ja: "PostgreSQL 18 のサービスを選択してください。他のメジャーバージョンはサポートされていません。"
        ms: "Pilih perkhidmatan PostgreSQL 18; versi utama lain tidak disokong."
        pt-br: "Selecione um serviço PostgreSQL 18; outras versões principais não são compatíveis."
        ru: "Выберите службу PostgreSQL 18; другие основные версии не поддерживаются."
        ko: "PostgreSQL 18 서비스를 선택하세요. 다른 주 버전은 지원되지 않습니다."
        tr: "PostgreSQL 18 hizmetini seçin; diğer ana sürümler desteklenmez."
      labelEn: Database Service
      labelZh: 数据库服务
      label:
        en: Database Service
        es-es: Servicio de base de datos
        fa: 'سرویس پایگاه داده'
        ja: データベースサービス
        ms: Perkhidmatan Pangkalan Data
        pt-br: Serviço de Banco de Dados
        ru: Сервис баз данных
        ko: 데이터베이스 서비스
        zh-Hant: 資料庫服務
        zh: 数据库服务
        tr: Veritabanı Hizmeti
      required: true
      type: service
    - default: ai_gateway
      envKey: PANEL_DB_NAME
      labelEn: Database
      labelZh: 数据库名
      label:
        en: Database
        es-es: Base de datos
        fa: 'پایگاه داده'
        ja: データベース
        ms: Pangkalan Data
        pt-br: Banco de Dados
        ru: База данных
        ko: 데이터베이스
        zh-Hant: 資料庫
        zh: 数据库
        tr: Veritabanı
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: ai_gateway
      envKey: PANEL_DB_USER
      labelEn: User
      labelZh: 数据库用户
      label:
        en: Database User
        es-es: Usuario de la base de datos
        fa: 'کاربر پایگاه داده'
        ja: データベースユーザー
        ms: Pengguna Pangkalan Data
        pt-br: Usuário do Banco de Dados
        ru: Пользователь базы данных
        ko: 데이터베이스 사용자
        zh-Hant: 資料庫用戶
        zh: 数据库用户
        tr: Veritabanı Kullanıcısı
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: ai_gateway
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Password
      labelZh: 数据库用户密码
      label:
        en: Database Password
        es-es: Contraseña de la base de datos
        fa: 'رمز عبور پایگاه داده'
        ja: データベースのパスワード
        ms: Kata Laluan Pangkalan Data
        pt-br: Senha do Banco de Dados
        ru: Пароль базы данных
        ko: 데이터베이스 비밀번호
        zh-Hant: 資料庫密碼
        zh: 数据库密码
        tr: Veritabanı Parolası
      random: true
      required: true
      rule: paramComplexity
      type: password
