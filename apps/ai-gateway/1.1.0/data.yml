additionalProperties:
  formFields:
    - default: admin
      disabled: true
      envKey: AI_GATEWAY_INITIAL_ADMIN_USERNAME
      labelEn: Username
      labelZh: "用户名"
      label:
        en: Username
        es-es: Usuario
        ja: "ユーザー名"
        ms: Pengguna
        pt-br: "Usuário"
        ru: "Имя пользователя"
        ko: "사용자 이름"
        zh-Hant: "使用者名稱"
        zh: "用户名"
        tr: "Kullanıcı adı"
      required: true
      rule: paramCommon
      type: text
    - default: 1PanelAI
      envKey: AI_GATEWAY_INITIAL_ADMIN_PASSWORD
      labelEn: "Initial Admin Password"
      labelZh: "初始管理员密码"
      label:
        en: "Initial Admin Password"
        es-es: "Initial Admin Password"
        ja: "Initial Admin Password"
        ms: "Initial Admin Password"
        pt-br: "Initial Admin Password"
        ru: "Initial Admin Password"
        ko: "Initial Admin Password"
        zh-Hant: "初始管理員密碼"
        zh: "初始管理员密码"
        tr: "Initial Admin Password"
      description:
        en: "Password length must be between 12 and 128 bytes"
        es-es: "La longitud de la contraseña debe ser de entre 12 y 128 bytes"
        ja: "パスワードの長さは12～128バイトである必要があります"
        ms: "Panjang kata laluan mestilah antara 12 hingga 128 bait"
        pt-br: "O comprimento da senha deve ser de 12 a 128 bytes"
        ru: "Длина пароля должна составлять от 12 до 128 байт"
        ko: "비밀번호 길이는 12~128바이트여야 합니다"
        zh-Hant: "密碼長度須為 12 至 128 位元組"
        zh: "密码长度须为 12 至 128 字节"
        tr: "Parola uzunluğu 12 ile 128 bayt arasında olmalıdır"
      random: true
      required: true
      rule: paramComplexity
      type: password
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: sqlite
      envKey: PANEL_DB_TYPE
      labelEn: Database
      labelZh: "数据库"
      label:
        en: Database
        es-es: "Base de datos"
        ja: "データベース"
        ms: "Pangkalan Data"
        pt-br: "Banco de Dados"
        ru: "База данных"
        ko: "데이터베이스"
        zh-Hant: "資料庫"
        zh: "数据库"
        tr: Veritabanı
      required: true
      type: apps
      values:
        - label: SQLite
          serviceRequired: false
          value: sqlite
        - label: PostgreSQL
          value: postgresql
    - default: ai_gateway
      envKey: PANEL_DB_NAME
      labelEn: "Database Name"
      labelZh: "数据库名"
      label:
        en: "Database Name"
        es-es: "Nombre de la base de datos"
        ja: "データベース名"
        ms: "Nama Pangkalan Data"
        pt-br: "Nome do Banco de Dados"
        ru: "Имя базы данных"
        ko: "데이터베이스 이름"
        zh-Hant: "資料庫名稱"
        zh: "数据库名"
        tr: "Veritabanı Adı"
      random: true
      required: true
      rule: paramCommon
      showWhen:
        envKey: PANEL_DB_TYPE
        values:
          - postgresql
      type: text
    - default: ai_gateway
      envKey: PANEL_DB_USER
      labelEn: "Database User"
      labelZh: "数据库用户"
      label:
        en: "Database User"
        es-es: "Usuario de la base de datos"
        ja: "データベースユーザー"
        ms: "Pengguna Pangkalan Data"
        pt-br: "Usuário do Banco de Dados"
        ru: "Пользователь базы данных"
        ko: "데이터베이스 사용자"
        zh-Hant: "資料庫使用者"
        zh: "数据库用户"
        tr: "Veritabanı Kullanıcısı"
      random: true
      required: true
      rule: paramCommon
      showWhen:
        envKey: PANEL_DB_TYPE
        values:
          - postgresql
      type: text
    - default: ai_gateway
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: "Database Password"
      labelZh: "数据库密码"
      label:
        en: "Database Password"
        es-es: "Contraseña de la base de datos"
        ja: "データベースパスワード"
        ms: "Kata Laluan Pangkalan Data"
        pt-br: "Senha do Banco de Dados"
        ru: "Пароль базы данных"
        ko: "데이터베이스 비밀번호"
        zh-Hant: "資料庫密碼"
        zh: "数据库密码"
        tr: "Veritabanı Parolası"
      random: true
      required: true
      rule: paramComplexity
      showWhen:
        envKey: PANEL_DB_TYPE
        values:
          - postgresql
      type: password
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: "Web UI Port"
      labelZh: "Web UI 端口"
      label:
        en: "Web UI Port"
        es-es: "Puerto web"
        ja: "Web UIポート"
        ms: "Port Web UI"
        pt-br: "Porta da Web UI"
        ru: "Порт веб-интерфейса"
        ko: "웹 UI 포트"
        zh-Hant: "Web UI 埠"
        zh: "Web UI 端口"
        tr: "Web UI Bağlantı Noktası"
      required: true
      rule: paramPort
      type: number
