services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.2.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5080"
    environment:
      ZO_LOCAL_MODE: "true"
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: "${ZO_ROOT_USER_EMAIL:?Set the administrator email}"
      ZO_ROOT_USER_PASSWORD: "${ZO_ROOT_USER_PASSWORD:?Set the administrator password}"
    volumes:
      - ./data:/data
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
