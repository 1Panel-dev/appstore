services:
  fizzy:
    image: ghcr.io/basecamp/fizzy:latest
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:80
    entrypoint: ["/usr/local/bin/fizzy-entrypoint", "./bin/thrust", "./bin/rails", "server"]
    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - DISABLE_SSL=${DISABLE_SSL}
      - BASE_URL=${BASE_URL}
      - MAILER_FROM_ADDRESS=${MAILER_FROM_ADDRESS}
      - SMTP_ADDRESS=${SMTP_ADDRESS}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TLS=${SMTP_TLS}
    volumes:
      - ./data:/rails/storage
      - ./scripts/entrypoint.sh:/usr/local/bin/fizzy-entrypoint:ro
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
