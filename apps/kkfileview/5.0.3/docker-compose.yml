services:
  kkfileview:
    container_name: ${CONTAINER_NAME}
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/kkfileview:5.0.3
    restart: always
    environment:
      KK_TRUST_HOST: ${KK_TRUST_HOST:-default}
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8012
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true
