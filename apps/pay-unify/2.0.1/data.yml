additionalProperties:
  formFields:
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: mysql
      envKey: PANEL_DB_TYPE
      labelEn: Database
      labelZh: 数据库服务
      label:
        en: Database
        zh: 数据库服务
        es-es: Base de datos
        fa: 'پایگاه داده'
        zh-Hant: 資料庫服務
        ja: データベースサービス
        ko: 데이터베이스 서비스
        ms: Perkhidmatan Pangkalan Data
        pt-br: Serviço de Banco de Dados
        ru: Сервис базы данных
        tr: Veritabanı Hizmeti
      required: true
      type: apps
      values:
        - label: MySQL
          value: mysql
        - label: MariaDB
          value: mariadb
        - label: PostgreSQL
          value: postgresql
    - default: payment_db
      envKey: PANEL_DB_NAME
      labelEn: Database name
      labelZh: 数据库名
      label:
        en: Database name
        zh: 数据库名
        es-es: Nombre de la base de datos
        fa: 'نام پایگاه داده'
        zh-Hant: 資料庫名稱
        ja: データベース名
        ko: 데이터베이스 이름
        ms: Nama pangkalan data
        pt-br: Nome do banco de dados
        ru: Имя базы данных
        tr: Veritabanı adı
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: payment_db
      envKey: PANEL_DB_USER
      labelEn: Database username
      labelZh: 数据库用户
      label:
        en: Database username
        zh: 数据库用户
        es-es: Usuario de la base de datos
        fa: 'نام کاربری پایگاه داده'
        zh-Hant: 資料庫使用者名稱
        ja: データベースユーザー名
        ko: 데이터베이스 사용자 이름
        ms: Nama pengguna pangkalan data
        pt-br: Nome de usuário do banco de dados
        ru: Имя пользователя базы данных
        tr: Veritabanı kullanıcı adı
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: ""
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database password
      labelZh: 数据库用户密码
      label:
        en: Database password
        zh: 数据库用户密码
        es-es: Contraseña de la base de datos
        fa: 'رمز عبور پایگاه داده'
        zh-Hant: 資料庫密碼
        ja: データベースパスワード
        ko: 데이터베이스 비밀번호
        ms: Kata laluan pangkalan data
        pt-br: Senha do banco de dados
        ru: Пароль базы данных
        tr: Veritabanı parolası
      random: true
      required: true
      type: password
    - default: ""
      envKey: PAY_JWT_SECRET
      labelEn: Console session secret (JWT)
      labelZh: 控制台会话密钥（JWT）
      label:
        en: Console session secret (JWT)
        zh: 控制台会话密钥（JWT）
        es-es: Secreto de sesión de consola (JWT)
        fa: 'کلید نشست کنسول (JWT)'
        zh-Hant: 主控台工作階段密鑰（JWT）
        ja: コンソールセッション秘密鍵（JWT）
        ko: 콘솔 세션 비밀키 (JWT)
        ms: Rahsia sesi konsol (JWT)
        pt-br: Segredo de sessão do console (JWT)
        ru: Секрет сессии консоли (JWT)
        tr: Konsol oturum anahtarı (JWT)
      random: true
      required: true
      type: password
    - default: ""
      envKey: PAY_ADMIN_PASSWORD
      labelEn: Initial admin password
      labelZh: 初始管理员密码
      label:
        en: Initial admin password
        zh: 初始管理员密码
        es-es: Contraseña inicial del administrador
        fa: 'رمز عبور اولیه مدیر'
        zh-Hant: 初始管理員密碼
        ja: 初期管理者パスワード
        ko: 초기 관리자 비밀번호
        ms: Kata laluan pentadbir awal
        pt-br: Senha inicial do administrador
        ru: Начальный пароль администратора
        tr: Başlangıç yönetici parolası
      random: true
      required: true
      type: password
    - default: 8097
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: 端口
      label:
        en: Port
        zh: 端口
        es-es: Puerto
        fa: 'پورت'
        zh-Hant: 埠
        ja: ポート
        ko: 포트
        ms: Port
        pt-br: Porta
        ru: Порт
        tr: Bağlantı Noktası
      required: true
      rule: paramPort
      type: number
