additionalProperties:
  formFields:
    - default: dragonfly
      envKey: PANEL_DRAGONFLY_ROOT_PASSWORD
      labelEn: "Database Password"
      labelZh: "数据库密码"
      label:
        en: "Database Password"
        es-es: "Contraseña de la base de datos"
        fa: "رمز عبور پایگاه داده"
        ja: "データベースパスワード"
        ms: "Kata Laluan Pangkalan Data"
        pt-br: "Senha do Banco de Dados"
        ru: "Пароль базы данных"
        ko: "데이터베이스 비밀번호"
        zh-Hant: "資料庫密碼"
        zh: "数据库密码"
        tr: "Veritabanı parolası"
      description:
        en: "Leave blank to allow connections without a password."
        es-es: "Deja este campo vacío para permitir conexiones sin contraseña."
        fa: "برای اتصال بدون رمز عبور، این فیلد را خالی بگذارید."
        ja: "空欄にするとパスワードなしで接続できます。"
        ms: "Biarkan kosong untuk membenarkan sambungan tanpa kata laluan."
        pt-br: "Deixe em branco para permitir conexões sem senha."
        ru: "Оставьте поле пустым, чтобы разрешить подключения без пароля."
        ko: "비워 두면 비밀번호 없이 연결할 수 있습니다."
        zh-Hant: "留空允許用戶端免密碼連線。"
        zh: "留空允许客户端免密连接。"
        tr: "Parolasız bağlantılara izin vermek için boş bırakın."
      random: true
      required: false
      edit: true
      type: password
    - default: 6379
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      labelZh: "端口"
      label:
        en: Port
        es-es: Puerto
        fa: "پورت"
        ja: "ポート"
        ms: Port
        pt-br: Porta
        ru: "Порт"
        ko: "포트"
        zh-Hant: "埠"
        zh: "端口"
        tr: "Bağlantı Noktası"
      required: true
      rule: paramPort
      type: number
