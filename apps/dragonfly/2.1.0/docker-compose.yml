services:
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v2.1.0
    container_name: "${CONTAINER_NAME}"
    restart: always
    ulimits:
      memlock: -1
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:6379"
    environment:
      DFLY_requirepass: "${PANEL_DRAGONFLY_ROOT_PASSWORD:-}"
    volumes:
      - ./data:/data
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
