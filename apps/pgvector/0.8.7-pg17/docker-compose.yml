services:
  pgvector:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: "${CONTAINER_NAME}"
    restart: always
    shm_size: 1g
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:5432"
    environment:
      POSTGRES_USER: "${PANEL_DB_ROOT_USER}"
      POSTGRES_PASSWORD: "${PANEL_DB_ROOT_PASSWORD}"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init/10-pgvector.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test:
        - CMD
        - pg_isready
        - "-h"
        - "127.0.0.1"
        - "-p"
        - "5432"
        - "-q"
        - "-U"
        - "${PANEL_DB_ROOT_USER}"
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
