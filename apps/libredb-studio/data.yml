        en: Self-hosted, browser-based database IDE supporting 16 engines including PostgreSQL, MySQL, MongoDB, Redis and ClickHouse, with SSO, RBAC and audit logs in the MIT build.
        zh: 自托管的浏览器数据库 IDE，支持 PostgreSQL、MySQL、MongoDB、Redis、ClickHouse 等 16 种引擎，MIT 版内置 SSO、RBAC 和审计日志。
