services:
  outline:
    image: outlinewiki/outline:1.10.1
    container_name: ${CONTAINER_NAME}
    restart: always
    ports:
      - ${PANEL_APP_PORT_HTTP}:3000
    networks:
      - 1panel-network
    depends_on:
      - keycloak
    env_file:
      - ./data/oidc.env
    volumes:
      - ./data/outline:/var/lib/outline/data
      - ./data/secrets/outline-secret-key:/run/secrets/outline-secret-key:ro
      - ./data/secrets/outline-utils-secret:/run/secrets/outline-utils-secret:ro
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${PANEL_DB_USER}:${PANEL_DB_USER_PASSWORD}@${PANEL_DB_HOST}:5432/${PANEL_DB_NAME}?schema=public
      REDIS_URL: redis://:${PANEL_REDIS_ROOT_PASSWORD}@${PANEL_REDIS_HOST}:6379
      SECRET_KEY_FILE: /run/secrets/outline-secret-key
      UTILS_SECRET_FILE: /run/secrets/outline-utils-secret
      DEFAULT_LANGUAGE: zh_CN
      URL: ${PANEL_APP_URL}
      PORT: 3000
      PGSSLMODE: disable
      SERVICES: collaboration,websockets,worker,web
      SEARCH_PROVIDER: postgres
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FILE_STORAGE_UPLOAD_MAX_SIZE: 262144000
      FILE_STORAGE_IMPORT_MAX_SIZE: 262144000
      FILE_STORAGE_WORKSPACE_IMPORT_MAX_SIZE: 262144000
      FORCE_HTTPS: "false"
      PROXY_HEADERS_TRUSTED: "true"
      RATE_LIMITER_ENABLED: "true"
      SLACK_MESSAGE_ACTIONS: "false"
      ENABLE_UPDATES: "true"
      DEBUG: ""
      LOG_LEVEL: info
      SMTP_HOST: ${PANEL_SMTP_HOST:-}
      SMTP_PORT: ${PANEL_SMTP_PORT:-}
      SMTP_USERNAME: ${PANEL_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${PANEL_SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${PANEL_SMTP_FROM_EMAIL:-}
      SMTP_SECURE: ${PANEL_SMTP_SECURE:-true}
    labels:
      createdBy: Apps

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: ${CONTAINER_NAME}-keycloak
    restart: always
    command:
      - start-dev
      - --import-realm
    ports:
      - ${PANEL_APP_PORT_HTTP_KEYCLOAK}:8080
    networks:
      - 1panel-network
    env_file:
      - ./data/keycloak.env
    volumes:
      - ./data/keycloak:/opt/keycloak/data
    labels:
      createdBy: Apps

  # One-shot helper: Keycloak cannot configure the master realm through realm
  # import, so the admin console localization is applied through the Admin API.
  # It exits after the update and does not affect the app status.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.3
    container_name: ${CONTAINER_NAME}-keycloak-init
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -u
        KCADM=/opt/keycloak/bin/kcadm.sh
        CFG=/tmp/kcadm.config
        for _ in $$(seq 1 60); do
          if $$KCADM config credentials --config "$$CFG" \
              --server http://${CONTAINER_NAME}-keycloak:8080 \
              --realm master --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" \
              --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD" >/dev/null 2>&1; then
            $$KCADM update realms/master --config "$$CFG" \
              -s internationalizationEnabled=true \
              -s 'supportedLocales=["zh-CN","en"]' \
              -s defaultLocale=zh-CN >/dev/null 2>&1 || true
            echo "master realm localization applied"
            exit 0
          fi
          sleep 3
        done
        echo "skipped: could not authenticate against the bundled Keycloak" >&2
        exit 0
    env_file:
      - ./data/keycloak.env
    networks:
      - 1panel-network
    depends_on:
      - keycloak
    labels:
      createdBy: Apps

networks:
  1panel-network:
    external: true
