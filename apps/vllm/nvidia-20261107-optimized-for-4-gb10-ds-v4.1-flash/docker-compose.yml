services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: ${CONTAINER_NAME}
    network_mode: host
    ipc: host
    restart: "no"
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    devices:
      - /dev/infiniband:/dev/infiniband:rwm
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
      core:
        soft: 0
        hard: 0
    security_opt:
      - seccomp=unconfined
      - label=disable
    shm_size: 16g
    mem_limit: 112g
    memswap_limit: 112g
    cpuset: 5-9,15-19
    device_cgroup_rules:
      - c 226:* rw
    volumes:
      - ${DSPARK_MODEL_HOST}:${DSPARK_MODEL_CONTAINER}:ro
      - ${DSPARK_MODEL_HOST}:/blobs:ro
      - ${CACHE_ROOT}/${CONTAINER_NAME}:/cache:rw
      - type: bind
        source: ${DRI_CARD}
        target: /dev/dri/card0
        bind:
          create_host_path: false
    environment:
      B12X_AUTOTUNE: "0"
      B12X_BIND_COMPILE_WORKERS: "2"
      B12X_COMPILE_CACHE_DIR: /cache/kkref/jit/b12x/compile
      B12X_CUTE_COMPILE_CACHE_DIR: /cache/kkref/jit/b12x/cute
      B12X_DENSE_SPLITK_TURBO: "1"
      B12X_STATE_COMPILE_WORKERS: "2"
      B12X_W4A8_TINY_DECODE: "0"
      B12X_WEIGHTS_COMPILE_WORKERS: "4"
      CUDA_CACHE_MAXSIZE: "4294967296"
      CUDA_CACHE_PATH: /cache/kkref/jit/nv-compute
      CUDA_DEVICE_MAX_CONNECTIONS: "32"
      CUTE_DSL_ARCH: sm_121a
      CUTE_DSL_CACHE_DIR: /cache/kkref/jit/cute-dsl
      FLASHINFER_WORKSPACE_BASE: /cache/kkref/flashinfer
      GLOO_SOCKET_IFNAME: ${ETH_IF}
      HF_HOME: /cache/huggingface
      HF_HUB_OFFLINE: "1"
      MAX_JOBS: "2"
      NCCL_BUFFSIZE: "1048576"
      NCCL_COLLNET_ENABLE: "0"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_CUMEM_HOST_ENABLE: "0"
      NCCL_DEBUG: WARN
      NCCL_DEBUG_SUBSYS: INIT
      NCCL_GIN_ENABLE: "0"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_DISABLE: "0"
      NCCL_IB_GID_INDEX: ${GID_INDEX}
      NCCL_IB_HCA: =${IB_IF}
      NCCL_IB_MERGE_NICS: "1"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_SUBNET_AWARE_ROUTING: "1"
      NCCL_IB_SUBNET_PREFIX_LEN: "24"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_LL128_BUFFSIZE: "262144"
      NCCL_MAX_NCHANNELS: "8"
      NCCL_MNNVL_ENABLE: "0"
      NCCL_NET: IB
      NCCL_NET_PLUGIN: none
      NCCL_NVLS_ENABLE: "0"
      NCCL_P2P_DISABLE: "1"
      NCCL_PAT_ENABLE: "0"
      NCCL_PROTO: ^LL128
      NCCL_RMA_DISABLE: "1"
      NCCL_RUNTIME_CONNECT: "1"
      NCCL_SHM_DISABLE: "1"
      NCCL_SOCKET_IFNAME: ${ETH_IF}
      OMP_NUM_THREADS: "8"
      PYTHONPATH: /opt/spark-ds41f/candidate/vllm:/opt/spark-ds41f/candidate/b12x
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True,garbage_collection_threshold:0.6
      SAFETENSORS_FAST_GPU: "1"
      SPARK_DS41F_DISPLAY_CARVEOUT_WEIGHTS: "0"
      SPARK_DS41F_DSPARK_DEAD_ROWS_TAU: "0.2"
      SPARK_DS41F_DSPARK_MAIN_PROJ_TP: "1"
      SPARK_DS41F_DSPARK_VOCAB_PARALLEL: "1"
      SPARKNET_ROCE_ALLGATHER_MAX_BYTES: "4194304"
      SPARKNET_ROCE_ALLREDUCE_CAPACITY_BYTES: "2097152"
      SPARKNET_ROCE_ALLREDUCE_DISPATCH_MAX_BYTES: "2097152"
      SPARKNET_ROCE_GID_INDEX: ${GID_INDEX}
      SPARKNET_ROCE_PROXY_CPU: big
      SPARKNET_ROCE_TIMEOUT_MS: "10000"
      SPARKNET_ROCE_TOPOLOGY: direct
      SPARKNET_ROCE_HCA: ${IB_IF}
      SPARK_DEPLOYMENT_TRANSPORT: oneshot-switched
      TILELANG_CACHE_DIR: /cache/kkref/jit/tilelang
      TORCHINDUCTOR_CACHE_DIR: /cache/kkref/jit/torchinductor
      TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      TP_SOCKET_IFNAME: ${ETH_IF}
      TRANSFORMERS_OFFLINE: "1"
      TRITON_CACHE_DIR: /cache/kkref/jit/triton
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_CACHE_DIR: /cache/kkref/jit/vllm-r5o
      VLLM_CACHE_ROOT: /cache/kkref/jit/vllm-r5o
      VLLM_DISABLE_PYNCCL: "0"
      VLLM_DS41_HEAD_DTYPE: float32
      VLLM_DS41_PACKED_BF16_LM_HEAD: "1"
      VLLM_ENABLE_PCIE_ALLREDUCE: "0"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
      VLLM_HOST_IP: ${VLLM_HOST_IP:-${LOCAL_IP}}
      VLLM_L2_PREFETCH_KERNELS: tilelang
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
      VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD: "1024"
      VLLM_PLUGINS: ""
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_STANDALONE_COMPILE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      XDG_CACHE_HOME: /cache/kkref/jit
      VLLM_LATE_ADMISSION_LAYER: "20"
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      NODE_RANK: ${NODE_RANK:-0}
      VLLM_PORT: ${VLLM_PORT}
    command: >-
      "${DSPARK_MODEL_CONTAINER}"
      --served-model-name "${SERVED_MODEL_NAME}"
      --host 0.0.0.0
      --port "${VLLM_PORT}"
      --tokenizer-mode deepseek_v41
      --dtype bfloat16
      --tensor-parallel-size 4
      --load-format direct
      --block-size 256
      --enable-prefix-caching
      --enable-prompt-tokens-details
      --enable-chunked-prefill
      --max-model-len 1048576
      --max-num-seqs 8
      --max-parallel-prefills 1
      --gpu-memory-utilization 0.82
      --max-num-batched-tokens 8192
      --kv-cache-memory-bytes 11274289152
      --max-cudagraph-capture-size 192
      --generation-config vllm
      --override-generation-config '{"temperature":1.0,"top_p":1.0}'
      --engram-config '{"table_memory":"disk","disk_resident_scales":false,"projection_tp":true}'
      --attention-backend TILELANG
      --linear-backend tilelang
      --moe-backend tilelang
      --speculative-config '{"method":"dspark","num_speculative_tokens":5,"draft_tensor_parallel_size":4,"attention_backend":"TILELANG","draft_sample_method":"greedy","rejection_sample_method":"block","enable_adaptive_verification":true,"adaptive_verification_row_cost":0.035}'
      --jit-monitor-mode warn
      --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"],"cudagraph_capture_sizes":[1,2,3,4,6,8,12,16,20,24,28,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192]}'
      --prefix-cache-retention-interval 8192
      --long-prefill-token-threshold 3856
      --async-scheduling
      --reasoning-parser deepseek_v41
      --tool-call-parser deepseek_v41
      --enable-auto-tool-choice
      --distributed-executor-backend mp
      --nnodes 4
      --no-scheduler-reserve-full-isl
      --no-enable-flashinfer-autotune
      --limit-mm-per-prompt '{"image":4}'
      --mm-processor-cache-gb 0
      --default-chat-template-kwargs '{"thinking":false}'
      --node-rank "${NODE_RANK:-0}"
      --master-addr "${MASTER_ADDR:-${LOCAL_IP}}"
      --master-port "${MASTER_PORT}"
    labels:
      createdBy: Apps
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os
          import urllib.request
          if os.environ["NODE_RANK"] == "0":
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open("http://127.0.0.1:" + os.environ["VLLM_PORT"] + "/health", timeout=5) as response:
                  if response.status != 200:
                      raise SystemExit(1)
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 480s
