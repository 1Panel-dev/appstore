services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: ${CONTAINER_NAME}
    network_mode: host
    ipc: host
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 64gb
    cap_add:
      - SYS_NICE
    ulimits:
      memlock: -1
      stack: 67108864
    devices:
      - /dev/infiniband:/dev/infiniband
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute]
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GLOO_SOCKET_IFNAME: ${ETH_IF}
      NCCL_SOCKET_IFNAME: ${ETH_IF}
      TP_SOCKET_IFNAME: ${ETH_IF}
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: =${IB_IF}
      NCCL_IB_GID_INDEX: ${GID_INDEX}
      NCCL_IB_AUTO_DETECT: "0"
      NCCL_DEBUG: WARN
      VLLM_HOST_IP: ${VLLM_HOST_IP:-${LOCAL_IP}}
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_MTP_DRAFT_VOCAB: /etc/vllm-draft-vocab.txt
      VLLM_FLASHINFER_AUTOTUNE_CACHE_DIR: /tmp/fi_autotune
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      NODE_RANK: ${NODE_RANK:-0}
      VLLM_PORT: ${VLLM_PORT}
    volumes:
      - ${DSPARK_MODEL_HOST}:${DSPARK_MODEL_CONTAINER}:ro
      - ${CACHE_ROOT}/${CONTAINER_NAME}/huggingface:/root/.cache/huggingface
      - ${CACHE_ROOT}/${CONTAINER_NAME}/vllm:/root/.cache/vllm
      - ${CACHE_ROOT}/${CONTAINER_NAME}/fi_autotune:/tmp/fi_autotune
      - ./scripts/patches/mtp_v030_patched.py:/usr/local/lib/python3.12/dist-packages/vllm/models/qwen4_exp/nvidia/mtp.py:ro
      - ./scripts/patches/draft_vocab_en_code_47k.txt:/etc/vllm-draft-vocab.txt:ro
    command:
      - "${DSPARK_MODEL_CONTAINER}"
      - "--served-model-name"
      - "${SERVED_MODEL_NAME}"
      - "--tensor-parallel-size"
      - "2"
      - "--distributed-executor-backend"
      - "mp"
      - "--nnodes"
      - "2"
      - "--node-rank"
      - "${NODE_RANK:-0}"
      - "--master-addr"
      - "${LOCAL_IP}"
      - "--master-port"
      - "${MASTER_PORT}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${VLLM_PORT}"
      - "--gpu-memory-utilization"
      - "${GPU_MEMORY_UTILIZATION}"
      - "--max-num-seqs"
      - "${MAX_NUM_SEQS}"
      - "--max-num-batched-tokens"
      - "${MAX_NUM_BATCHED_TOKENS}"
      - "--max-model-len"
      - "${MAX_MODEL_LEN}"
      - "--kv-cache-dtype"
      - "${KV_CACHE_DTYPE}"
      - "--mamba-ssm-cache-dtype"
      - "${MAMBA_SSM_CACHE_DTYPE}"
      - "--load-format"
      - "safetensors"
      - "--safetensors-load-strategy"
      - "lazy"
      - "--enable-chunked-prefill"
      - "--enable-prompt-tokens-details"
      - "--enable-expert-parallel"
      - "--all2all-backend"
      - "allgather_reducescatter"
      - "--mm-encoder-tp-mode"
      - "data"
      - "--reasoning-parser"
      - "${REASONING_PARSER}"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${TOOL_CALL_PARSER}"
      - "--speculative-config"
      - "${SPECULATIVE_CONFIG}"
      - "--compilation-config"
      - "${COMPILATION_CONFIG}"
      - "--engram-config"
      - "{\"cpu_offload\":false}"
    labels:
      createdBy: Apps
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os
          import urllib.request
          if os.environ["NODE_RANK"] == "0":
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open("http://127.0.0.1:" + os.environ["VLLM_PORT"] + "/health", timeout=5) as response:
                  if response.status != 200:
                      raise SystemExit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3000s
