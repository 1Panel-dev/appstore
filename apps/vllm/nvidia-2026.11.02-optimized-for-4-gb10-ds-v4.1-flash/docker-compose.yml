services:
  vllm:
    image: ${IMAGE_NAME:-eugr/spark-vllm-b12x:latest}
    pull_policy: never
    container_name: ${CONTAINER_NAME}
    profiles:
      - lifecycle
    networks:
      - 1panel-network
    volumes:
      - ${DSPARK_MODEL_HOST:-/opt/deepseek-ai/DeepSeek-V4.1-Flash}:/models/DeepSeek-V4.1-Flash:ro
    ipc: host
    entrypoint: []
    command:
      - bash
      - -c
      - 'echo "Start this application through scripts/start.sh on the head node." >&2; exit 1'
    labels:
      createdBy: Apps
networks:
  1panel-network:
    external: true
