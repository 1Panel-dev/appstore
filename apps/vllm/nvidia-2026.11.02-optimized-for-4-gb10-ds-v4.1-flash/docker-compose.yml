services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE}
    pull_policy: ${IMAGE_PULL_POLICY:-if_not_present}
    container_name: ${CONTAINER_NAME}
    entrypoint: []
    network_mode: host
    ipc: host
    privileged: true
    restart: ${DSPARK_RESTART_POLICY:-no}
    stop_grace_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock: -1
      nofile:
        soft: ${VLLM_SPARK_NOFILE_LIMIT:-1048576}
        hard: ${VLLM_SPARK_NOFILE_LIMIT:-1048576}
    volumes:
      - ${DSPARK_MODEL_HOST}:${DSPARK_MODEL_CONTAINER}:ro
      - ${HF_HOME:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${HOME}/.cache/vllm:/root/.cache/vllm
      - ${HOME}/.cache/flashinfer:/root/.cache/flashinfer
      - ${HOME}/.cache/b12x:/root/.cache/b12x
      - ${HOME}/.triton:/root/.triton
      - ${HOME}/.tilelang:/root/.tilelang
    environment:
      DSPARK_MODEL_CONTAINER: ${DSPARK_MODEL_CONTAINER}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
      VLLM_PORT: ${VLLM_PORT}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      NODE_RANK: ${NODE_RANK:-0}
      MASTER_ADDR: ${MASTER_ADDR:-${LOCAL_IP}}
      MASTER_PORT: ${MASTER_PORT:-29501}
      VLLM_HOST_IP: ${VLLM_HOST_IP:-${LOCAL_IP}}
      RAY_NODE_IP_ADDRESS: ${VLLM_HOST_IP:-${LOCAL_IP}}
      RAY_OVERRIDE_NODE_IP_ADDRESS: ${VLLM_HOST_IP:-${LOCAL_IP}}
      MN_IF_NAME: ${ETH_IF}
      UCX_NET_DEVICES: ${ETH_IF}
      NCCL_SOCKET_IFNAME: ${ETH_IF}
      NCCL_IB_HCA: ${IB_IF}
      NCCL_IB_DISABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      OMPI_MCA_btl_tcp_if_include: ${ETH_IF}
      GLOO_SOCKET_IFNAME: ${ETH_IF}
      TP_SOCKET_IFNAME: ${ETH_IF}
      RAY_memory_monitor_refresh_ms: "0"
      RAY_num_prestart_python_workers: "0"
      RAY_object_store_memory: "1073741824"
      VLLM_ENABLE_ROCE_ALLREDUCE: ${CONTAINER_VLLM_ENABLE_ROCE_ALLREDUCE:-1}
      VLLM_ROCE_ALLREDUCE_MAX_SIZE: ${CONTAINER_VLLM_ROCE_ALLREDUCE_MAX_SIZE:-2MB}
      B12X_COMPILE_WORKERS: ${CONTAINER_B12X_COMPILE_WORKERS:-4}
      CUTE_DSL_ARCH: ${CONTAINER_CUTE_DSL_ARCH:-sm_121a}
      VLLM_USE_V2_MODEL_RUNNER: ${CONTAINER_VLLM_USE_V2_MODEL_RUNNER:-1}
      VLLM_USE_BREAKABLE_CUDAGRAPH: ${CONTAINER_VLLM_USE_BREAKABLE_CUDAGRAPH:-1}
      VLLM_MXFP8_LM_HEAD: ${CONTAINER_VLLM_MXFP8_LM_HEAD:-1}
      HF_HUB_OFFLINE: ${CONTAINER_HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${CONTAINER_TRANSFORMERS_OFFLINE:-1}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os
          import urllib.request
          if os.environ["NODE_RANK"] == "0":
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              with opener.open("http://127.0.0.1:" + os.environ["VLLM_PORT"] + "/health", timeout=5) as response:
                  if response.status != 200:
                      raise SystemExit(1)
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 480s
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        NODE_ARGS=(--nnodes 4 --node-rank "$${NODE_RANK}" --master-addr "$${MASTER_ADDR}" --master-port "$${MASTER_PORT}")
        case "$${NODE_RANK}" in
          0) ;;
          1|2|3) NODE_ARGS+=(--headless) ;;
          *) echo "NODE_RANK must be 0, 1, 2 or 3" >&2; exit 1 ;;
        esac
        exec vllm serve "$${DSPARK_MODEL_CONTAINER}" \
          --served-model-name "$${SERVED_MODEL_NAME}" \
          --host 0.0.0.0 \
          --port "$${VLLM_PORT}" \
          --dtype bfloat16 \
          --tensor-parallel-size 4 \
          --load-format b12x \
          --block-size 256 \
          --enable-prefix-caching \
          --gpu-memory-utilization 0.85 \
          --default-chat-template-kwargs '{"enable_thinking":false}' \
          --max-model-len auto \
          --max-num-seqs 4 \
          --max-num-batched-tokens 4096 \
          --limit-mm-per-prompt '{"image":1}' \
          --engram-config '{"cpu_offload":false,"table_memory":"disk"}' \
          --linear-backend b12x \
          --moe-backend b12x \
          --attention-backend b12x \
          --speculative-config '{"method":"dspark","num_speculative_tokens":7,"draft_tensor_parallel_size":4,"attention_backend":"B12X","draft_sample_method":"probabilistic","rejection_sample_method":"standard","enable_adaptive_verification":true}' \
          --reasoning-parser deepseek_v41 \
          --tool-call-parser deepseek_v41 \
          --enable-auto-tool-choice \
          "$${NODE_ARGS[@]}"
    labels:
      createdBy: Apps
