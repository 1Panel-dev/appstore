services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE}
    pull_policy: never
    container_name: ${CONTAINER_NAME}
    profiles:
      - lifecycle
    network_mode: host
    volumes:
      - ${DSPARK_MODEL_HOST}:${DSPARK_MODEL_CONTAINER}:ro
    ipc: host
    environment:
      DSPARK_MODEL_CONTAINER: ${DSPARK_MODEL_CONTAINER}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME}
      VLLM_PORT: ${VLLM_PORT}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    entrypoint: []
    command:
      - bash
      - -c
      - 'echo "Start this application through scripts/start.sh on the head node." >&2; exit 1'
    labels:
      createdBy: Apps
