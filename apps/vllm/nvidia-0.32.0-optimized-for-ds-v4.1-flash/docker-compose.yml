services:
  vllm:
    image: ${IMAGE:-1panel/vllm:v0.32.0-optimized-for-ds-v4.1-flash}
    container_name: ${CONTAINER_NAME}
    restart: always
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - 1panel-network
    volumes:
      - ./cache/huggingface:/root/.cache/huggingface
      - ${MODEL_DIR:-./cache/models}/:/models/${MODEL_NAME:-model}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_ENDPOINT: https://hf-mirror.com
    ports:
      - ${PANEL_APP_PORT_HTTP}:8000
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    command: ${START_COMMAND:---model ${MODEL}}
networks:
  1panel-network:
    external: true
