networks:
  1panel-network:
    external: true
services:
  vllm:
    image: ${IMAGE:-intel/llm-scaler-vllm:0.26.0-b2}
    container_name: ${CONTAINER_NAME}
    restart: always
    devices:
      - /dev/dri:/dev/dri
    environment:
      - no_proxy=localhost,127.0.0.1
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8001
    privileged: true
    shm_size: 32g
    volumes:
      - ${MODEL_DIR}/:/models/${MODEL_NAME}
    command: ${START_COMMAND}
